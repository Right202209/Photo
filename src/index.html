<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.3.8/photoswipe.min.css">
    <!-- GSAP loaded deferred so it never blocks first paint; ScrollTrigger drives the scroll-reveal. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>
    <div class="scroll-progress" aria-hidden="true"></div>

    <!-- Ambient GSAP-animated orbs, confined to the empty side gutters on wide
         screens. The rails collapse to zero width below the gallery's max-width,
         so this layer self-hides without a media query. -->
    <div class="bg-decor" aria-hidden="true">
        <div class="bg-decor__rail bg-decor__rail--left">
            <span class="bg-orb" data-depth="0.35"></span>
            <span class="bg-orb" data-depth="0.7"></span>
            <span class="bg-orb" data-depth="0.5"></span>
        </div>
        <div class="bg-decor__rail bg-decor__rail--right">
            <span class="bg-orb" data-depth="0.55"></span>
            <span class="bg-orb" data-depth="0.3"></span>
            <span class="bg-orb" data-depth="0.65"></span>
        </div>
    </div>
    <header class="site-header">
        <div class="site-header__inner">
            <p class="site-header__eyebrow">Photography</p>
            <h1>Gallery</h1>
            <span class="site-header__rule" aria-hidden="true"></span>
            <p class="site-header__subtitle">A curated collection of moments — light, color, and stillness.</p>
        </div>
    </header>

    <main class="gallery" id="gallery">
        <!-- Images will be injected here -->
    </main>

    <div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="pswp__bg"></div>
        <div class="pswp__scroll-wrap">
            <div class="pswp__container">
                <div class="pswp__item"></div>
                <div class="pswp__item"></div>
                <div class="pswp__item"></div>
            </div>
            <div class="pswp__ui pswp__ui--hidden">
                <div class="pswp__top-bar">
                    <div class="pswp__counter"></div>
                    <button class="pswp__button pswp__button--close" title="Close (Esc)"></button>
                    <button class="pswp__button pswp__button--share" title="Share"></button>
                    <button class="pswp__button pswp__button--fs" title="Toggle fullscreen"></button>
                    <button class="pswp__button pswp__button--zoom" title="Zoom in/out"></button>
                    <div class="pswp__preloader">
                        <div class="pswp__preloader__icn">
                            <div class="pswp__preloader__cut">
                                <div class="pswp__preloader__donut"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pswp__share-modal pswp__share-modal--hidden pswp__single-tap">
                    <div class="pswp__share-tooltip"></div>
                </div>
                <button class="pswp__button pswp__button--arrow--left" title="Previous (arrow left)"></button>
                <button class="pswp__button pswp__button--arrow--right" title="Next (arrow right)"></button>
                <div class="pswp__caption">
                    <div class="pswp__caption__center"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
